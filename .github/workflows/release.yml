name: Release artifact

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  package:
    name: Package and attest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm run verify:package

      - name: Build package archive
        run: npm pack --pack-destination release

      - name: Upload package archive
        uses: actions/upload-artifact@v4
        with:
          name: guardian-autopilot-package
          path: release/*.tgz
          if-no-files-found: error

      - name: Attest package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.tgz
