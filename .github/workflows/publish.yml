name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish the package from the selected v* tag to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.confirm_publish == true && startsWith(github.ref, 'refs/tags/v')
    name: Publish with npm trusted publishing
    runs-on: ubuntu-latest
    environment:
      name: npm-release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm client for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm run verify:package

      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs "${GITHUB_REF_NAME}"

      - name: Publish package
        run: npm publish --access public
