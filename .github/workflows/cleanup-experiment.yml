name: Guardian cleanup review

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Repository-relative path to review for removal
        required: true
        type: string
      checks:
        description: Tracked verification JSON file in the repository
        required: true
        type: string
      allow_preparation:
        description: Approve the preparation commands in that file
        required: true
        type: boolean
        default: false
      create_pr:
        description: Open a draft pull request after the review checks pass
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string
      checks:
        required: true
        type: string
      allow_preparation:
        required: false
        type: boolean
        default: false
      create_pr:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  review:
    # Even callers must require a manual dispatch for each unproven candidate.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: target
          persist-credentials: false
      - name: Check out Guardian at the workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: guardian-tool
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Build Guardian
        working-directory: guardian-tool
        run: |
          npm ci --ignore-scripts
          npm run build:cli
      - name: Run reviewed cleanup experiment
        env:
          GUARDIAN_CANDIDATE: ${{ inputs.candidate }}
          GUARDIAN_CHECKS: ${{ inputs.checks }}
          GUARDIAN_ALLOW_PREPARATION: ${{ inputs.allow_preparation }}
        run: |
          git -C "$GITHUB_WORKSPACE/target" config user.name "$GITHUB_ACTOR"
          git -C "$GITHUB_WORKSPACE/target" config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/guardian-review"
          extra=()
          if [ "$GUARDIAN_ALLOW_PREPARATION" = "true" ]; then extra+=(--allow-preparation); fi
          node "$GITHUB_WORKSPACE/guardian-tool/scripts/github-cleanup-experiment.mjs" \
            --target "$GITHUB_WORKSPACE/target" \
            --candidate "$GUARDIAN_CANDIDATE" \
            --checks "$GUARDIAN_CHECKS" \
            --head "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/guardian-review" "${extra[@]}"
      - name: Upload patch for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guardian-cleanup-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/guardian-review/
          if-no-files-found: error
          retention-days: 7

  publish-draft:
    needs: review
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && inputs.create_pr && needs.review.result == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact reviewed commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: target
          persist-credentials: false
      - name: Check out Guardian at the workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: guardian-tool
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Build the trusted Guardian tool
        working-directory: guardian-tool
        run: |
          npm ci --ignore-scripts
          npm run build:cli
      - name: Open draft for human review
        env:
          GH_TOKEN: ${{ github.token }}
          GUARDIAN_TARGET: ${{ github.workspace }}/target
          GUARDIAN_CANDIDATE: ${{ inputs.candidate }}
          GUARDIAN_CHECKS: ${{ inputs.checks }}
        run: node "$GITHUB_WORKSPACE/guardian-tool/scripts/github-cleanup-publisher.mjs"
